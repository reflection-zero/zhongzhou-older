      master:
        url: jdbc:mysql://mysql:3306/zzyl?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true

ruoyi:
  profile: /home/ruoyi/uploadPath

